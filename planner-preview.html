<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>12-Page Productivity Planner</title>
<style>
:root{--canvas:#eee7e1;--paper:#fffdfb;--paper2:#fbf7f3;--ink:#4f4642;--muted:#8b7f79;--line:#ded2cb;--line2:#eee5df;--rose:#c78e98;--rose2:#e8cbd0;--roseSoft:#f6e9eb;--sage:#aab6a3;--sageSoft:#e8ece4;--taupe:#cdbbad;--taupeSoft:#eee5df;--lav:#b8abc1;--lavSoft:#eee9f1;--gold:#b9855f;--serif:Georgia,"Times New Roman",serif;--sans:Inter,"Segoe UI",Arial,sans-serif;--hand:"Segoe Print","Bradley Hand",cursive;--shadow:0 18px 48px rgba(82,64,55,.16)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:var(--sans);color:var(--ink)}body{background:radial-gradient(circle at 15% 8%,#faf5f1 0,#eee7e1 55%,#e2d8d1 100%);display:flex;justify-content:center;align-items:flex-start;padding:14px;overflow:auto}button,input,textarea{font:inherit;color:inherit}button{border:0}#viewport{width:1440px;height:1024px;position:relative;transform-origin:top left;flex:0 0 auto}#stage{position:absolute;inset:0;border-radius:28px;background:linear-gradient(145deg,#f7f0eb,#eadfd8);border:1px solid rgba(151,123,108,.28);box-shadow:var(--shadow);overflow:hidden}.brandbar{position:absolute;left:22px;right:72px;top:12px;height:42px;display:flex;align-items:center;justify-content:space-between;z-index:30}.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:17px;letter-spacing:.02em}.brand i{width:28px;height:28px;border-radius:50%;background:linear-gradient(145deg,#e7c3c9,#c78e98);display:inline-block;border:1px solid #c98e99;position:relative}.brand i:after{content:"";position:absolute;width:10px;height:16px;border:1.5px solid #fff;border-left:0;border-bottom:0;border-radius:80% 20% 80% 20%;left:8px;top:5px;transform:rotate(32deg)}.brand small{font:600 10px var(--sans);text-transform:uppercase;letter-spacing:.18em;color:var(--muted);display:block;margin-top:2px}.header-actions{display:flex;gap:8px}.soft-btn{border:1px solid #d9cbc4;background:rgba(255,253,251,.9);border-radius:14px;padding:8px 12px;cursor:pointer;font-size:11px;letter-spacing:.06em;text-transform:uppercase}.soft-btn:hover{background:#fff}.soft-btn.active{background:var(--rose);color:#fff;border-color:var(--rose)}.planner-shell{position:absolute;left:18px;right:70px;top:60px;bottom:18px;border-radius:20px;background:#f4ebe5;border:1px solid #d8c8bf;padding:10px;box-shadow:0 7px 20px rgba(71,57,48,.10)}.spread{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 50px minmax(0,1fr)}.page{position:relative;background:linear-gradient(180deg,var(--paper),var(--paper2));border:1px solid #d8cdc6;overflow:hidden}.page.left{border-radius:16px 3px 3px 16px;box-shadow:inset -8px 0 12px rgba(120,98,87,.04)}.page.right{border-radius:3px 16px 16px 3px;box-shadow:inset 8px 0 12px rgba(120,98,87,.04)}.page::after{content:"";position:absolute;inset:9px;border:1px dashed rgba(199,142,152,.11);border-radius:12px;pointer-events:none}.page-inner{position:absolute;inset:26px 28px 24px;z-index:2;overflow:hidden}.gutter{position:relative;background:linear-gradient(90deg,#f6eee9 0,#e4d6ce 47%,#e4d6ce 53%,#f6eee9 100%);border-top:1px solid #d4c3b9;border-bottom:1px solid #d4c3b9;z-index:4}.gutter:before,.gutter:after{content:"";position:absolute;top:0;bottom:0;width:1px;background:#c9b3a6;opacity:.7}.gutter:before{left:18px}.gutter:after{right:18px}.rings{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-around;align-items:center;padding:42px 0;z-index:7;pointer-events:none}.ring{width:68px;height:19px;border-radius:14px;background:linear-gradient(180deg,#f3cfad 0,#b27d59 42%,#744c35 49%,#d8a678 67%,#f2d1af 100%);box-shadow:0 3px 5px rgba(67,43,28,.30),inset 0 1px 2px rgba(255,255,255,.8);position:relative}.ring:after{content:"";position:absolute;left:9px;right:9px;top:5px;height:6px;border-radius:8px;background:#f8ebdd;box-shadow:inset 0 1px 2px rgba(91,57,36,.22)}.page-rail{position:absolute;right:6px;top:68px;bottom:25px;width:63px;display:grid;grid-template-rows:repeat(12,minmax(0,1fr));gap:4px;z-index:40}.page-tab{border:1px solid #d5c6be;border-radius:0 13px 13px 0;background:#f4ebe6;cursor:pointer;font-size:10px;line-height:1.05;padding:2px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:.16s}.page-tab:nth-child(4n+1){background:#f2dfe2}.page-tab:nth-child(4n+2){background:#e8ece4}.page-tab:nth-child(4n+3){background:#ede8ef}.page-tab:nth-child(4n){background:#efe5df}.page-tab:hover{transform:translateX(-2px)}.page-tab.active{background:linear-gradient(180deg,#d89faa,#c68591);color:#fff;border-color:#c98f98;font-weight:700;box-shadow:0 4px 12px rgba(160,91,105,.18)}.eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:10px;color:#a4777c;font-weight:700}.title{font-family:var(--serif);font-size:42px;line-height:1.02;font-weight:400;margin:0;color:#534946;letter-spacing:-.02em}.subtitle{font-family:var(--serif);font-size:18px;color:#bb747d;margin-top:7px}.hand{font-family:var(--hand);font-size:15px;color:#b47f77;transform:rotate(-1deg)}.card{border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.65);overflow:hidden;min-width:0;min-height:0}.card-header{height:31px;display:flex;align-items:center;justify-content:center;text-transform:uppercase;letter-spacing:.12em;font-size:10px;font-weight:700;color:#655b57;background:linear-gradient(180deg,#f7e9eb,#efd9dd);border-bottom:1px solid var(--line)}.card-header.sage{background:linear-gradient(180deg,#eef1ea,#e2e6dc)}.card-header.lav{background:linear-gradient(180deg,#f0ebf2,#e5dfe8)}.card-header.taupe{background:linear-gradient(180deg,#f3ece7,#e9dfd8)}.card-body{padding:11px;height:calc(100% - 31px);overflow:hidden}.editable{outline:none;min-height:20px;overflow:auto;white-space:pre-wrap}.editable:empty:before{content:attr(data-placeholder);color:#b7ada7}.ruled{background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 28px,#e4dad4 29px)}.dotted{background-image:radial-gradient(#d4c7c0 1px,transparent 1px);background-size:15px 15px}.line-list{display:flex;flex-direction:column}.line-row{height:33px;border-bottom:1px dotted #cabdb6;display:flex;align-items:center;gap:8px;font-size:12px}.checkbox{width:15px;height:15px;border:1px solid #bca8a0;border-radius:3px;background:#fff;flex:0 0 auto;cursor:pointer}.checkbox.checked{background:var(--rose);box-shadow:inset 0 0 0 4px #fff}.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.quick-card{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.74);padding:14px;min-height:102px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;transition:.16s}.quick-card:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(91,70,60,.08)}.quick-card h3{font-family:var(--serif);font-size:20px;font-weight:400;margin:4px 0}.quick-card p{font-size:11px;color:var(--muted);margin:0;line-height:1.4}.quick-card .icon{font-size:21px}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{border:1px solid var(--line);border-radius:12px;background:#fffdfa;padding:10px;text-align:center}.stat span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}.stat strong{display:block;font-family:var(--serif);font-size:20px;margin-top:5px;font-weight:400}.calendar{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:27px repeat(5,1fr);height:100%;border:1px solid #e0d6d0;border-radius:9px;overflow:hidden}.calendar>div{border-right:1px solid #e5dcd6;border-bottom:1px solid #e5dcd6;padding:4px;font-size:10px}.calendar .dow{background:#f6e9eb;text-align:center;font-weight:700;padding-top:7px}.calendar .cell{outline:none;overflow:auto}.week-grid{display:grid;grid-template-columns:62px repeat(7,1fr);grid-template-rows:30px repeat(6,1fr);height:100%;border:1px solid #ddd2cc;border-radius:9px;overflow:hidden}.week-grid>div{border-right:1px solid #e3dad4;border-bottom:1px solid #e3dad4;font-size:9px;padding:3px}.week-grid .head{background:#f6e9eb;font-weight:700;text-align:center;padding-top:8px}.week-grid .time{background:#fbf7f4;font-weight:700;text-align:center;padding-top:9px}.habit-table{display:grid;grid-template-columns:1.3fr repeat(7,22px);gap:7px 5px;align-items:center;font-size:10px}.habit-dot,.rating-dot{border:1px solid #c6b5ae;border-radius:50%;cursor:pointer;background:#fff}.habit-dot{width:18px;height:18px}.habit-dot.on,.rating-dot.on{background:var(--rose);box-shadow:inset 0 0 0 4px #fff}.rating-dot{width:17px;height:17px}.form-field label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--muted);margin-bottom:4px}.form-field input{width:100%;border:0;border-bottom:1px solid #cabcb4;background:transparent;outline:none;padding:6px 2px;font-size:12px}.footer-nav{position:absolute;left:26px;right:26px;bottom:10px;height:28px;display:flex;align-items:center;justify-content:space-between;z-index:8}.footer-nav button{border:1px solid #dbcfc8;border-radius:12px;background:#fffaf7;padding:5px 10px;font-size:10px;cursor:pointer}.footer-nav .pnum{font-size:10px;color:var(--muted);letter-spacing:.08em}.sticker-toggle{position:absolute;left:18px;bottom:18px;z-index:45;border:1px solid #d5c6be;background:#fffaf7;border-radius:0 13px 13px 0;padding:8px 14px;cursor:pointer;font-size:11px;letter-spacing:.08em;text-transform:uppercase}.sticker-drawer{position:absolute;left:18px;bottom:58px;width:430px;max-height:500px;background:#fffdfa;border:1px solid #d8cbc3;border-radius:14px;box-shadow:0 16px 36px rgba(67,52,44,.18);z-index:60;display:none;overflow:hidden}.sticker-drawer.open{display:block}.drawer-head{height:48px;padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.sticker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px;max-height:440px;overflow:auto}.sticker{min-height:54px;border:1px solid #e1d5cf;border-radius:12px;background:linear-gradient(180deg,#fff,#fbf4f2);display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;font-size:10px;font-weight:700;cursor:grab;user-select:none}.placed-sticker{position:absolute;z-index:18;padding:8px 10px;border:1px solid #ddcfc8;border-radius:12px;background:#fff8f8;box-shadow:0 4px 9px rgba(82,64,55,.10);font-size:11px;font-weight:700;cursor:move;user-select:none;min-width:70px;text-align:center}.placed-sticker.sage{background:#f0f4ed}.placed-sticker.lav{background:#f2edf4}.placed-sticker.taupe{background:#f4ece6}.placed-sticker .x{position:absolute;right:-6px;top:-7px;width:16px;height:16px;border-radius:50%;background:#695b55;color:white;font-size:10px;display:none;align-items:center;justify-content:center}.placed-sticker:hover .x{display:flex}.toast{position:absolute;left:50%;bottom:28px;transform:translate(-50%,20px);background:#554944;color:#fff;padding:8px 14px;border-radius:18px;font-size:11px;opacity:0;transition:.2s;z-index:100;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:900px){body{padding:0}#viewport{transform:scale(.62);margin-bottom:-380px}}
</style>
</head>
<body>
<div id="viewport"><div id="stage"><div class="brandbar"><div class="brand"><i></i><div>Productivity Planner<small>12-page client edition</small></div></div><div class="header-actions"><button class="soft-btn" id="saveBtn">Save</button><button class="soft-btn" id="resetBtn">Reset</button></div></div><div class="planner-shell"><div class="spread"><section class="page left"><div class="page-inner" id="leftPage"></div><div class="footer-nav" id="leftFooter"></div></section><div class="gutter"><div class="rings" id="rings"></div></div><section class="page right"><div class="page-inner" id="rightPage"></div><div class="footer-nav" id="rightFooter"></div></section></div></div><div class="page-rail" id="rail"></div><button class="sticker-toggle" id="stickerToggle">Stickers</button><div class="sticker-drawer" id="stickerDrawer"><div class="drawer-head"><h3>Mini Sticker Library</h3><span>Drag onto either page</span></div><div class="sticker-grid" id="stickerGrid"></div></div><div class="toast" id="toast">Saved</div></div></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];const storeKey='client12Planner_v1';let state={spread:0,data:{},checks:{},stickers:[]};try{const x=JSON.parse(localStorage.getItem(storeKey)||'null');if(x)state={...state,...x}}catch(e){}const pages=[{name:'Home',icon:'⌂'},{name:'Goals',icon:'✦'},{name:'Month',icon:'◫'},{name:'Week',icon:'▦'},{name:'Day',icon:'☼'},{name:'Projects',icon:'◇'},{name:'Habits',icon:'◉'},{name:'Budget',icon:'$'},{name:'Wellness',icon:'♡'},{name:'Ideas',icon:'✎'},{name:'Notes',icon:'≡'},{name:'Reset',icon:'↻'}];const stickerItems=[['★','TODAY'],['!','IMPORTANT'],['↑','PRIORITY'],['✓','DONE'],['↻','RESCHEDULE'],['○','PENDING'],['☎','CALL'],['✉','EMAIL'],['◷','MEETING'],['⌁','DEADLINE'],['☼','FOCUS'],['⚡','DEEP WORK'],['☕','BREAK'],['♡','SELF CARE'],['☾','REST'],['✦','CELEBRATE'],['⌂','HOME'],['▣','WORK'],['✎','IDEA'],['☑','TO DO'],['💰','PAID'],['$','BUDGET'],['↗','SAVINGS'],['🛒','SHOP'],['♥','HEALTH'],['◉','HABIT'],['💧','WATER'],['🏃','MOVE'],['📖','READ'],['✿','WELLNESS'],['✈','TRAVEL'],['⌖','BOOKING'],['🧳','PACK'],['📍','PLACE'],['☁','DREAM'],['⚑','GOAL'],['◆','PROJECT'],['→','NEXT'],['←','BACK'],['↗','GROW'],['●','PLAN'],['✧','CREATE'],['♢','CONTENT'],['⌁','FOLLOW UP'],['✓','APPROVED'],['✕','CANCELLED'],['♫','FUN'],['☕','COFFEE'],['♡','GRATEFUL'],['✦','WIN']];
function save(show=true){capture();localStorage.setItem(storeKey,JSON.stringify(state));if(show)toast('Saved')}function capture(){$$('[contenteditable][data-key]').forEach(el=>state.data[el.dataset.key]=el.innerHTML);$$('input[data-key]').forEach(el=>state.data[el.dataset.key]=el.value)}function hydrate(){$$('[contenteditable][data-key]').forEach(el=>{if(state.data[el.dataset.key]!=null)el.innerHTML=state.data[el.dataset.key]});$$('input[data-key]').forEach(el=>{if(state.data[el.dataset.key]!=null)el.value=state.data[el.dataset.key]});$$('.checkbox[data-check],.habit-dot[data-check],.rating-dot[data-check]').forEach(el=>{if(state.checks[el.dataset.check])el.classList.add('checked','on')})}function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1200)}function card(title,body,tone=''){return `<div class="card" style="height:100%"><div class="card-header ${tone}">${title}</div><div class="card-body">${body}</div></div>`}function lines(n,key,check=true){return `<div class="line-list">${Array.from({length:n},(_,i)=>`<div class="line-row">${check?`<span class="checkbox" data-check="${key}-c${i}"></span>`:''}<div class="editable" contenteditable data-key="${key}-${i}" style="flex:1"></div></div>`).join('')}</div>`}function field(label,key,ph=''){return `<div class="form-field"><label>${label}</label><input data-key="${key}" placeholder="${ph}"></div>`}function miniStats(){return `<div class="stat-grid"><div class="stat"><span>Top Goal</span><strong contenteditable data-key="home-stat-goal">01</strong></div><div class="stat"><span>Habits</span><strong contenteditable data-key="home-stat-habit">04</strong></div><div class="stat"><span>Focus</span><strong contenteditable data-key="home-stat-focus">80%</strong></div></div>`}
function home(){return `<div class="eyebrow">Welcome to your planner</div><h1 class="title">Plan gently.<br>Move clearly.</h1><div class="subtitle">A compact system for your goals, work, life and ideas.</div><div class="quick-grid" style="margin-top:24px"><div class="quick-card" data-go="1"><div class="icon">✦</div><div><h3>Goals</h3><p>Clarify the direction before choosing the route.</p></div></div><div class="quick-card" data-go="2"><div class="icon">◫</div><div><h3>Plan the month</h3><p>See priorities, dates, habits and reminders.</p></div></div><div class="quick-card" data-go="4"><div class="icon">☼</div><div><h3>Focus today</h3><p>Choose the few things that deserve your energy.</p></div></div><div class="quick-card" data-go="5"><div class="icon">◇</div><div><h3>Projects</h3><p>Move the work forward without losing the details.</p></div></div></div><div style="margin-top:16px">${miniStats()}</div><div class="hand" style="margin-top:18px">Small pages. Clear priorities. Better days. ♡</div>`}function goals(){return `<div class="eyebrow">Vision & direction</div><h1 class="title">Goals</h1><div class="subtitle">Decide what matters before filling your calendar.</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;height:190px;margin-top:18px">${card('How I want to feel',`<div class="editable ruled" contenteditable data-key="goal-feel" data-placeholder="Calm, focused, healthy..." style="height:125px;line-height:29px"></div>`)}${card('Main focus',`<div class="editable ruled" contenteditable data-key="goal-focus" data-placeholder="What matters most?" style="height:125px;line-height:29px"></div>`,'sage')}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;height:305px;margin-top:12px">${card('Top goals',lines(7,'goals-top'))}${card('Why they matter',lines(7,'goals-why',false),'lav')}</div><div style="height:150px;margin-top:12px">${card('Quarter focus',`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:9px"><div>${field('Q1','q1')}</div><div>${field('Q2','q2')}</div><div>${field('Q3','q3')}</div><div>${field('Q4','q4')}</div></div>`,'taupe')}</div>`}function month(){let cells=Array.from({length:35},(_,i)=>`<div class="cell editable" contenteditable data-key="month-cell-${i}"></div>`).join('');return `<div class="eyebrow">Monthly command centre</div><h1 class="title">Month</h1><div class="subtitle">A clear month begins with a clear overview.</div><div style="display:grid;grid-template-columns:1.55fr .85fr;gap:12px;height:670px;margin-top:16px"><div class="card"><div class="card-header">Monthly calendar</div><div class="card-body"><div class="calendar"><div class="dow">M</div><div class="dow">T</div><div class="dow">W</div><div class="dow">T</div><div class="dow">F</div><div class="dow">S</div><div class="dow">S</div>${cells}</div></div></div><div style="display:grid;grid-template-rows:1fr 1fr 1fr;gap:12px">${card('Month goals',lines(4,'month-goals'))}${card('Reminders',lines(4,'month-reminders'),'taupe')}${card('Reflection',`<div class="editable ruled" contenteditable data-key="month-reflection" style="height:125px;line-height:29px"></div>`,'lav')}</div></div>`}function week(){let heads=['','Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((x,i)=>`<div class="${i?'head':'time'}">${x}</div>`).join('');let rows=['Morning','Midday','Afternoon','Evening','Focus','Notes'].map((t,r)=>`<div class="time">${t}</div>${Array.from({length:7},(_,c)=>`<div class="entry editable" contenteditable data-key="week-${r}-${c}"></div>`).join('')}`).join('');return `<div class="eyebrow">Weekly priority plan</div><h1 class="title">Week</h1><div class="subtitle">Turn your priorities into a practical seven-day plan.</div><div style="display:grid;grid-template-columns:.82fr 1.8fr;gap:12px;height:665px;margin-top:16px"><div style="display:grid;grid-template-rows:1fr 1fr 1fr;gap:12px">${card('Top 3 outcomes',lines(3,'week-outcomes'))}${card('Appointments',lines(5,'week-appts',false),'sage')}${card('Next week prep',`<div class="editable ruled" contenteditable data-key="week-next" style="height:140px;line-height:29px"></div>`,'taupe')}</div><div class="card"><div class="card-header lav">Week at a glance</div><div class="card-body"><div class="week-grid">${heads}${rows}</div></div></div></div>`}function day(){return `<div class="eyebrow">Daily focus</div><h1 class="title">Today</h1><div class="subtitle">A focused day does not need a crowded list.</div><div style="display:grid;grid-template-columns:.9fr 1.25fr;gap:12px;height:670px;margin-top:16px"><div style="display:grid;grid-template-rows:120px 1fr 185px;gap:12px">${card('Date & intention',`${field('Date','day-date','Today')}${field('I will focus on','day-focus','One meaningful outcome')}`,'taupe')}${card('Priority tasks',lines(8,'day-tasks'))}${card('Evening reset',lines(4,'day-evening',false),'lav')}</div><div style="display:grid;grid-template-rows:1fr 200px;gap:12px">${card('Schedule',lines(13,'day-schedule',false),'sage')}${card('Notes',`<div class="editable dotted" contenteditable data-key="day-notes" style="height:140px"></div>`)}</div></div>`}function projects(){return `<div class="eyebrow">Project dashboard</div><h1 class="title">Projects</h1><div class="subtitle">Keep important work visible and moving.</div><div style="display:grid;grid-template-columns:1.2fr .8fr;gap:12px;height:670px;margin-top:16px"><div style="display:grid;grid-template-rows:155px 1fr;gap:12px">${card('Project overview',`${field('Project','project-name','Project name')}<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">${field('Deadline','project-deadline','Date')}${field('Status','project-status','Planning / Active')}</div>`,'lav')}${card('Milestones & action steps',lines(11,'project-actions'))}</div><div style="display:grid;grid-template-rows:1fr 1fr;gap:12px">${card('Client / business tasks',lines(7,'project-client'),'sage')}${card('Project notes',`<div class="editable dotted" contenteditable data-key="project-notes" style="height:265px"></div>`,'taupe')}</div></div>`}function habits(){let days=['M','T','W','T','F','S','S'];let row=(name,r)=>`<div class="editable" contenteditable data-key="habit-name-${r}">${name}</div>${days.map((d,c)=>`<span class="habit-dot" data-check="habit-${r}-${c}"></span>`).join('')}`;return `<div class="eyebrow">Habits & routines</div><h1 class="title">Habits</h1><div class="subtitle">Consistency is easier when progress is visible.</div><div style="display:grid;grid-template-columns:1.2fr .8fr;gap:12px;height:670px;margin-top:16px"><div class="card"><div class="card-header sage">Weekly habit tracker</div><div class="card-body"><div class="habit-table"><div></div>${days.map(d=>`<b>${d}</b>`).join('')}${['Morning routine','Movement','Water','Reading','Deep work','No-spend','Evening reset','Self-care','Custom habit'].map(row).join('')}</div><div style="margin-top:24px">${card('Routine notes',`<div class="editable ruled" contenteditable data-key="habit-notes" style="height:230px;line-height:29px"></div>`,'taupe')}</div></div></div><div style="display:grid;grid-template-rows:1fr 1fr;gap:12px">${card('Habit I am building',lines(7,'habit-build'))}${card('What makes it easier?',lines(7,'habit-easier',false),'lav')}</div></div>`}function budget(){return `<div class="eyebrow">Money with intention</div><h1 class="title">Budget</h1><div class="subtitle">Keep your money simple, visible and intentional.</div><div style="margin-top:16px">${miniStats()}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;height:535px;margin-top:12px">${card('Income',lines(12,'budget-income',false),'sage')}${card('Expenses',lines(12,'budget-expense',false))}</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;height:105px;margin-top:12px">${card('Savings',field('Target','budget-savings','$'))}${card('Bills due',field('Amount','budget-bills','$'),'taupe')}${card('Money note',`<div class="editable" contenteditable data-key="budget-note" data-placeholder="One money priority..."></div>`,'lav')}</div>`}function wellness(){return `<div class="eyebrow">Mind & body</div><h1 class="title">Wellness</h1><div class="subtitle">Productivity works better when you are well.</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;height:670px;margin-top:16px">${card('Wellness check-in',`<div style="display:grid;grid-template-columns:1fr repeat(5,18px);gap:18px 7px;align-items:center;font-size:12px">${['Energy','Mood','Focus','Stress','Sleep'].map((x,r)=>`<span>${x}</span>${Array.from({length:5},(_,i)=>`<span class="rating-dot" data-check="well-${r}-${i}"></span>`).join('')}`).join('')}</div><div style="margin-top:24px">${field('Water','well-water','Glasses')}</div><div style="margin-top:12px">${field('Movement','well-move','What did you do?')}</div>`,'sage')}${card('Self-care & reflection',`<div class="editable ruled" contenteditable data-key="well-reflection" data-placeholder="How am I really doing?" style="height:590px;line-height:29px"></div>`,'lav')}</div>`}function ideas(){return `<div class="eyebrow">Business & creative thinking</div><h1 class="title">Ideas</h1><div class="subtitle">Capture the idea before it disappears.</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;height:670px;margin-top:16px">${card('Idea bank',lines(14,'ideas-bank',false),'lav')}${card('Content / business opportunities',`<div class="editable dotted" contenteditable data-key="ideas-content" style="height:590px"></div>`,'sage')}</div>`}function notes(){return `<div class="eyebrow">Notes library</div><h1 class="title">Notes</h1><div class="subtitle">A generous space for thoughts, details and reminders.</div><div style="display:grid;grid-template-columns:1.25fr .75fr;gap:12px;height:670px;margin-top:16px">${card('Lined notes',`<div class="editable ruled" contenteditable data-key="notes-main" style="height:590px;line-height:29px"></div>`)}<div style="display:grid;grid-template-rows:1fr 1fr;gap:12px">${card('Quick capture',lines(8,'notes-quick',false),'taupe')}${card('People / follow-ups',lines(8,'notes-follow',false),'sage')}</div></div>`}function reset(){return `<div class="eyebrow">Reflect & reset</div><h1 class="title">Reset</h1><div class="subtitle">Close the loop, notice the progress, choose the next step.</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;height:670px;margin-top:16px">${card('What worked?',`<div class="editable ruled" contenteditable data-key="reset-worked" style="height:250px;line-height:29px"></div>`,'sage')}${card('What will I improve?',`<div class="editable ruled" contenteditable data-key="reset-improve" style="height:250px;line-height:29px"></div>`,'lav')}${card('Wins to celebrate',lines(7,'reset-wins',false),'taupe')}${card('My next 3 moves',lines(7,'reset-next'))}</div>`}
const renderers=[home,goals,month,week,day,projects,habits,budget,wellness,ideas,notes,reset];function render(){capture();const leftIdx=state.spread*2,rightIdx=leftIdx+1;$('#leftPage').innerHTML=renderers[leftIdx]();$('#rightPage').innerHTML=renderers[rightIdx]();renderFooter(leftIdx,rightIdx);renderRail();hydrate();bind();renderPlaced()}function renderFooter(l,r){$('#leftFooter').innerHTML=`<button data-prev>← Prev</button><span class="pnum">${String(l+1).padStart(2,'0')} / 12 · ${pages[l].name}</span><button data-next>Next →</button>`;$('#rightFooter').innerHTML=`<button data-prev>← Prev</button><span class="pnum">${String(r+1).padStart(2,'0')} / 12 · ${pages[r].name}</span><button data-next>Next →</button>`}function renderRail(){const active=[state.spread*2,state.spread*2+1];$('#rail').innerHTML=pages.map((p,i)=>`<button class="page-tab ${active.includes(i)?'active':''}" data-page="${i}"><span>${p.icon}</span><span>${p.name}</span></button>`).join('')}function bind(){$$('[data-go]').forEach(el=>el.onclick=()=>goPage(+el.dataset.go));$$('[data-page]').forEach(el=>el.onclick=()=>goPage(+el.dataset.page));$$('[data-prev]').forEach(el=>el.onclick=()=>{state.spread=Math.max(0,state.spread-1);render()});$$('[data-next]').forEach(el=>el.onclick=()=>{state.spread=Math.min(5,state.spread+1);render()});$$('.checkbox[data-check],.habit-dot[data-check],.rating-dot[data-check]').forEach(el=>el.onclick=()=>{const k=el.dataset.check;state.checks[k]=!state.checks[k];el.classList.toggle('checked',state.checks[k]);el.classList.toggle('on',state.checks[k]);save(false)});$$('[contenteditable],input').forEach(el=>el.addEventListener('input',()=>save(false)))}function goPage(i){state.spread=Math.floor(i/2);render()}function buildRings(){$('#rings').innerHTML=Array.from({length:12},()=>'<span class="ring"></span>').join('')}function buildStickers(){$('#stickerGrid').innerHTML=stickerItems.map((s,i)=>`<div class="sticker" draggable="true" data-sticker="${i}"><div><b>${s[0]}</b>${s[1]}</div></div>`).join('');$$('.sticker').forEach(el=>el.addEventListener('dragstart',e=>e.dataTransfer.setData('text/sticker',el.dataset.sticker)))}function renderPlaced(){$$('.placed-sticker').forEach(x=>x.remove());const pageEls=[$('.page.left'),$('.page.right')];state.stickers.forEach((s,i)=>{if(s.spread!==state.spread)return;const host=pageEls[s.side];const div=document.createElement('div');div.className='placed-sticker '+(s.tone||'');div.style.left=s.x+'px';div.style.top=s.y+'px';div.dataset.idx=i;div.innerHTML=`${s.icon}<br>${s.label}<span class="x">×</span>`;host.appendChild(div);makeDrag(div);div.querySelector('.x').onclick=ev=>{ev.stopPropagation();state.stickers.splice(i,1);save(false);renderPlaced()}})}function makeDrag(el){let ox=0,oy=0,down=false;el.onpointerdown=e=>{if(e.target.classList.contains('x'))return;down=true;ox=e.offsetX;oy=e.offsetY;el.setPointerCapture(e.pointerId)};el.onpointermove=e=>{if(!down)return;const host=el.parentElement,r=host.getBoundingClientRect();let x=(e.clientX-r.left)-ox,y=(e.clientY-r.top)-oy;x=Math.max(5,Math.min(r.width-el.offsetWidth-5,x));y=Math.max(5,Math.min(r.height-el.offsetHeight-5,y));el.style.left=x+'px';el.style.top=y+'px'};el.onpointerup=e=>{if(!down)return;down=false;const i=+el.dataset.idx;state.stickers[i].x=parseFloat(el.style.left);state.stickers[i].y=parseFloat(el.style.top);save(false)}}function dropSetup(){$$('.page').forEach((host,side)=>{host.addEventListener('dragover',e=>e.preventDefault());host.addEventListener('drop',e=>{e.preventDefault();const id=+e.dataTransfer.getData('text/sticker');if(Number.isNaN(id))return;const r=host.getBoundingClientRect(),item=stickerItems[id];state.stickers.push({spread:state.spread,side,x:e.clientX-r.left-35,y:e.clientY-r.top-22,icon:item[0],label:item[1],tone:['','sage','lav','taupe'][id%4]});save(false);renderPlaced()})})}$('#rail').addEventListener('click',e=>{const btn=e.target.closest('[data-page]');if(btn)goPage(+btn.dataset.page)});$('#stickerToggle').onclick=()=>{$('#stickerDrawer').classList.toggle('open');$('#stickerToggle').classList.toggle('active')};$('#saveBtn').onclick=()=>save(true);$('#resetBtn').onclick=()=>{if(confirm('Clear all entries and placed stickers?')){state={spread:0,data:{},checks:{},stickers:[]};localStorage.removeItem(storeKey);render();toast('Reset complete')}};function fit(){const s=Math.min((innerWidth-28)/1440,(innerHeight-28)/1024,1);$('#viewport').style.transform=`scale(${s})`;$('#viewport').style.marginBottom=(1024*s-1024)+'px'}addEventListener('resize',fit);buildRings();buildStickers();render();dropSetup();fit();
</script>
