<section class="section"><div class="container form-shell"><div class="form-intro"><p class="eyebrow">Website Check</p><h1 class="display">Check Your Website Today</h1><p>Answer a few questions. Find what needs fixing.</p></div><form class="diagnostic" id="website-check-form"><div class="field"><label for="website-url">Website URL</label><input id="website-url" type="text" placeholder="yourbusiness.com" required></div><div class="field"><label for="website-goal">Main goal</label><select id="website-goal" required><option value="">Choose one</option><option>More enquiries</option><option>More bookings</option><option>More sales</option><option>More quote requests</option><option>Better-fit leads</option><option>Clearer service decisions</option></select></div><div class="question"><p class="eyebrow">Clarity</p><h3>Can a new visitor understand what you offer from the first screen?</h3><div class="option-grid"><label class="option"><input type="radio" name="clarity" value="10"><span>Yes — immediately.</span></label><label class="option"><input type="radio" name="clarity" value="8"><span>Mostly.</span></label><label class="option"><input type="radio" name="clarity" value="6"><span>The offer is there, but the difference is unclear.</span></label><label class="option"><input type="radio" name="clarity" value="4"><span>People often need extra explanation.</span></label></div></div><div class="question"><p class="eyebrow">Conversion</p><h3>Is the next action obvious?</h3><div class="option-grid"><label class="option"><input type="radio" name="conversion" value="10"><span>Yes — clear and specific.</span></label><label class="option"><input type="radio" name="conversion" value="8"><span>Clear, but generic.</span></label><label class="option"><input type="radio" name="conversion" value="6"><span>Several actions compete.</span></label><label class="option"><input type="radio" name="conversion" value="4"><span>Most pages just say “contact us.”</span></label></div></div><div clas
