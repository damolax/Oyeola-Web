<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Website Check | Oyeola</title><meta name="description" content="Check clarity, trust and conversion to see what your website should improve next."><link rel="canonical" href="https://oyeola-web.vercel.app/website-check"><link rel="icon" href="assets/logos/favicon.svg"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/styles.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script></head><body><header class="site-header"></header><main>
<section class="section"><div class="container form-shell"><div class="form-intro"><p class="eyebrow">Website Check</p><h1 class="display">What is stopping more visitors from acting?</h1><p>Answer the questions. Get the priority.</p></div><form class="diagnostic" id="website-check-form"><div class="field"><label for="website-url">Website URL</label><input id="website-url" type="text" placeholder="yourbusiness.com" required></div><div class="field"><label for="website-goal">Main goal</label><select id="website-goal" required><option value="">Choose one</option><option>More enquiries</option><option>More bookings</option><option>More sales</option><option>More quote requests</option><option>Better-fit leads</option><option>Clearer service decisions</option></select></div><div class="question"><p class="eyebrow">Clarity</p><h3>Can a new visitor understand what you offer from the first screen?</h3><div class="option-grid"><label class="option"><input type="radio" name="clarity" value="10"><span>Yes — immediately.</span></label><label class="option"><input type="radio" name="clarity" value="8"><span>Mostly.</span></label><label class="option"><input type="radio" name="clarity" value="6"><span>The offer is there, but the difference is unclear.</span></label><label class="option"><input type="radio" name="clarity" value="4"><span>People often need extra explanation.</span></label></div></div><div class="question"><p class="eyebrow">Conversion</p><h3>Is the next action obvious?</h3><div class="option-grid"><label class="option"><input type="radio" name="conversion" value="10"><span>Yes — clear and specific.</span></label><label class="option"><input type="radio" name="conversion" value="8"><span>Clear, but generic.</span></label><label class="option"><input type="radio" name="conversion" value="6"><span>Several actions compete.</span></label><label class="option"><input type="radio" name="conversion" value="4"><span>Most pages just say “contact us.”</span></label></div></div><div class="question"><p class="eyebrow">Trust</p><h3>Can visitors verify that you can deliver?</h3><div class="option-grid"><label class="option"><input type="radio" name="trust" value="10"><span>Strong proof is easy to find.</span></label><label class="option"><input type="radio" name="trust" value="8"><span>Useful proof, but not always near the decision.</span></label><label class="option"><input type="radio" name="trust" value="6"><span>Proof is generic or buried.</span></label><label class="option"><input type="radio" name="trust" value="4"><span>Very little proof.</span></label></div></div><div id="website-status" class="status">No result yet.</div><button class="btn" type="submit">Check my website</button><section class="result hidden" id="website-result"></section></form></div></section>
</main><footer class="footer"></footer><script src="assets/js/site.js"></script><script src="assets/js/check-leads.js"></script></body></html>
