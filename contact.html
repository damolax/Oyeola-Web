<form class="diagnostic lead-form" data-lead-form data-success="Thanks — your project context was sent to Oyeola."><input type="hidden" name="type" value="contact"><div class="honeypot" aria-hidden="true"><label>Company fax<input name="company_fax" tabindex="-1" autocomplete="off"></label></div><div class="form-grid"><div class="field"><label for="contact-name">Name</label><input id="contact-name" name="name" autocomplete="name" required></div><div class="field"><label for="contact-email">Email</label><input id="contact-email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="contact-service">Project type</label><select id="contact-service" name="service_type" required><option value="">Choose one</option><option>Website</option><option>Interactive website feature</option><option>Operations system</option><option>Digital planner</option><option>Not sure yet</option></select></div><div class="field"><label for="contact-timeline">Timeline</label><select id="contact-timeline" name="timeline"><option value="">Choose one</option><option>As soon as practical</option><option>2–4 weeks</option><option>1–3 months</option><option>Exploring options</option></select></div><div class="field full"><label for="contact-url">Relevant URL</label><input id="contact-url" name="business_url" type="url" placeholder="https://"></div><div class="field full"><label for="contact-problem">What is not working?</label><textarea id="contact-problem" name="problem" required></textarea></div><div class="field full"><label for="contact-result">What should happen instead?</label><textarea id="contact-result" name="desired_result" required></textarea></div></div><button class="btn" type="submit">Send project context</button><p class="form-status" data-form-status aria-live="polite"></p></form></div></section>
